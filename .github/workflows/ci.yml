name: CI

on:
  push:
    # claude/** : les pushes du bot Claude Code ne déclenchent pas les
    # évènements pull_request (synchronize) — on couvre via push.
    branches: [main, "claude/**"]
  pull_request:

# Moindre privilège pour le GITHUB_TOKEN (lecture seule du dépôt).
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche/PR pour économiser des minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests, build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm run test:run

      - name: Build de production
        run: npm run build

      # Typecheck non-bloquant : erreurs de type préexistantes (tests + RecipeNew.tsx).
      # `vite build` ne vérifie pas les types ; ce step les surface via `tsc -b`.
      # À repasser en bloquant une fois cette dette résorbée.
      - name: Typecheck (informatif)
        run: npm run typecheck
        continue-on-error: true

      # Lint non-bloquant : le repo porte une dette `no-explicit-any` préexistante.
      # À repasser en bloquant une fois cette dette résorbée.
      - name: Lint (informatif)
        run: npm run lint
        continue-on-error: true

  edge-functions:
    name: Edge functions (tests Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Tests Deno (modules partagés)
        run: deno test supabase/functions/_shared/
