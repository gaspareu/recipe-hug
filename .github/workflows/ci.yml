name: CI

on:
  push:
    # claude/** : les pushes du bot Claude Code ne déclenchent pas les
    # évènements pull_request (synchronize) — on couvre via push.
    branches: [main, "claude/**"]
  pull_request:

# Moindre privilège pour le GITHUB_TOKEN (lecture seule du dépôt).
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche/PR pour économiser des minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tests, build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm run test:run

      - name: Build de production
        run: npm run build

      # Typecheck non-bloquant : erreurs de type préexistantes (tests + RecipeNew.tsx).
      # `vite build` ne vérifie pas les types ; ce step les surface via `tsc -b`.
      # À repasser en bloquant une fois cette dette résorbée.
      - name: Typecheck (informatif)
        run: npm run typecheck
        continue-on-error: true

      # Lint non-bloquant : le repo porte une dette `no-explicit-any` préexistante.
      # À repasser en bloquant une fois cette dette résorbée.
      - name: Lint (informatif)
        run: npm run lint
        continue-on-error: true

  edge-functions:
    name: Edge functions (tests Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # --node-modules-dir=none : le job Deno n'exécute pas `npm ci`, donc pas de
      #   node_modules local. Le repo porte un package.json -> Deno passe en mode
      #   « byonm » et exige ce node_modules pour résoudre @types/node (référencé
      #   par les types supabase-js). Ce flag force la résolution par le cache
      #   Deno (comme le runtime edge en prod, sans node_modules).
      # --allow-env : les tests decrypt-keys manipulent AI_KEYS_ENCRYPTION_SECRET
      #   via Deno.env pour vérifier le comportement fail-closed.
      - name: Tests Deno (modules partagés)
        run: deno test --allow-env --node-modules-dir=none supabase/functions/_shared/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Restreint au push sur `main` (post-merge) : on ne veut JAMAIS exposer les
    # secrets du compte test au code d'une PR (le job lance `npm ci`/`npm run`,
    # contrôlés par la PR → vecteur "pwn request"). Ces E2E écrivent des données
    # réelles sur le compte test (nettoyées en fin de test).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Valeurs publiques (clé anon, déjà exposée dans le bundle client).
      VITE_SUPABASE_URL: https://ifpqsyyvytfpossqycpc.supabase.co
      VITE_SUPABASE_PROJECT_ID: ifpqsyyvytfpossqycpc
      VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcHFzeXl2eXRmcG9zc3F5Y3BjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1MTA2MzIsImV4cCI6MjA5NjA4NjYzMn0.8bJ-S00EJG8nrKyfsBbOPPr3BrHtti5lOgBvIXBQ6xE
      # Compte de test (secrets de dépôt).
      TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
      TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
