name: CI

on:
  push:
    # Les branches de travail Codex sont aussi couvertes directement par push.
    branches: [main, "codex/**"]
  pull_request:

# Moindre privilège pour le GITHUB_TOKEN (lecture seule du dépôt).
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche/PR pour économiser des minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuser les nouvelles vulnérabilités élevées
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  frontend:
    name: Frontend (tests, build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm run test:run

      - name: Build de production
        run: npm run build

      # `vite build` ne vérifie pas les types ; ce step est donc un garde-fou distinct.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  edge-functions:
    name: Edge functions (tests Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # --node-modules-dir=none : le job Deno n'exécute pas `npm ci`, donc pas de
      #   node_modules local. Le repo porte un package.json -> Deno passe en mode
      #   « byonm » et exige ce node_modules pour résoudre @types/node (référencé
      #   par les types supabase-js). Ce flag force la résolution par le cache
      #   Deno (comme le runtime edge en prod, sans node_modules).
      # --allow-env limité : les tests manipulent uniquement les clés IA factices
      #   et AI_KEYS_ENCRYPTION_SECRET via Deno.env.
      # --frozen : garantit que la résolution Deno correspond au deno.lock versionné.
      # --min-dep-age=0 : Deno résout aussi les dépendances npm du package.json
      #   racine (frontend), qu'aucun module `_shared/` n'importe. Sa politique
      #   d'âge minimal (24 h) faisait donc échouer le job sur chaque PR
      #   Dependabot rebasée le jour d'une publication npm. Le garde-fou
      #   supply-chain reste assuré côté frontend par `npm ci` (lockfile).
      - name: Tests Deno (modules partagés)
        run: deno test --allow-env=ANTHROPIC_API_KEY,GEMINI_API_KEY,OPENAI_API_KEY,AI_KEYS_ENCRYPTION_SECRET --node-modules-dir=none --frozen --min-dep-age=0 supabase/functions/_shared/

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Restreint au push sur `main` (post-merge) : on ne veut JAMAIS exposer les
    # secrets du compte test au code d'une PR (le job lance `npm ci`/`npm run`,
    # contrôlés par la PR → vecteur "pwn request"). Ces E2E écrivent des données
    # réelles sur le compte test (nettoyées en fin de test).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Valeurs publiques du projet Supabase de développement. Les E2E ne doivent
      # jamais écrire dans la base de production.
      VITE_SUPABASE_URL: https://dltaxjvwtxjpbzcwdqvu.supabase.co
      VITE_SUPABASE_PROJECT_ID: dltaxjvwtxjpbzcwdqvu
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_weMLl8YF7Q_hLtPcxoPioQ_HWMWl738
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e
        env:
          # Les secrets ne sont accessibles qu'au processus de test, pas à npm ci
          # ni à l'installation du navigateur.
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
