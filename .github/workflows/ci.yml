name: CI

on:
  push:
    # Les branches de travail Codex sont aussi couvertes directement par push.
    branches: [main, "codex/**"]
  pull_request:

# Moindre privilège pour le GITHUB_TOKEN (lecture seule du dépôt).
permissions:
  contents: read

# Annule les runs obsolètes d'une même branche/PR pour économiser des minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuser les nouvelles vulnérabilités élevées
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development

  frontend:
    name: Frontend (tests, build, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Tests unitaires (Vitest)
        run: npm run test:run

      - name: Build de production
        run: npm run build

      # `vite build` ne vérifie pas les types ; ce step est donc un garde-fou distinct.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Code mort en production
        run: npm run lint:dead-code

  edge-functions:
    name: Edge functions (tests Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js pour la distribution officielle de Deno
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc

      # Le paquet officiel embarque le binaire par plateforme : aucun accès aux
      # assets GitHub Releases ni script postinstall n'est nécessaire.
      - name: Installer Deno 2.9.5 depuis npm
        run: |
          npm install --prefix "$RUNNER_TEMP/deno-cli" --ignore-scripts --no-audit --no-fund deno@2.9.5
          echo "$RUNNER_TEMP/deno-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Vérifier la version de Deno
        run: deno --version

      # La configuration Deno des fonctions est isolée sous `supabase/functions/` :
      # son lockfile ne résout que les imports Edge, indépendamment du package.json
      # frontend modifié par Dependabot.
      # `nodeModulesDir: none` force la résolution par le cache Deno (comme le
      # runtime Edge en prod, sans node_modules).
      # --allow-env limité : les tests manipulent uniquement les clés IA factices
      #   et AI_KEYS_ENCRYPTION_SECRET via Deno.env.
      # --frozen : garantit que la résolution correspond au lockfile Edge versionné.
      - name: Tests Deno (modules partagés et voix)
        run: deno test --config supabase/functions/deno.json --allow-env=ANTHROPIC_API_KEY,GEMINI_API_KEY,OPENAI_API_KEY,AI_KEYS_ENCRYPTION_SECRET --frozen supabase/functions/_shared/ supabase/functions/elevenlabs-tts/ supabase/functions/elevenlabs-scribe-token/

      - name: Typecheck des Edge Functions vocales
        run: deno check --config supabase/functions/deno.json --frozen supabase/functions/elevenlabs-tts/index.ts supabase/functions/elevenlabs-scribe-token/index.ts

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Restreint au push sur `main` (post-merge) : on ne veut JAMAIS exposer les
    # secrets du compte test au code d'une PR (le job lance `npm ci`/`npm run`,
    # contrôlés par la PR → vecteur "pwn request"). Ces E2E écrivent des données
    # réelles sur le compte test (nettoyées en fin de test).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      # Valeurs publiques du projet Supabase de développement. Les E2E ne doivent
      # jamais écrire dans la base de production.
      VITE_SUPABASE_URL: https://dltaxjvwtxjpbzcwdqvu.supabase.co
      VITE_SUPABASE_PROJECT_ID: dltaxjvwtxjpbzcwdqvu
      VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_weMLl8YF7Q_hLtPcxoPioQ_HWMWl738
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright (chromium + deps)
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e
        env:
          # Les secrets ne sont accessibles qu'au processus de test, pas à npm ci
          # ni à l'installation du navigateur.
          TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
          TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}

      - name: Rapport Playwright (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
