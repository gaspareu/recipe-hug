name: Deploy Supabase backend

# Applique les migrations puis déploie les edge functions Supabase à chaque
# merge sur main qui modifie le backend. L'ordre est impératif : une fonction
# ne doit jamais dépendre d'un RPC qui n'existe pas encore en production.
# Élimine la dérive « repo ≠ prod » causée par les déploiements manuels depuis
# des sessions parallèles (cf. incidents du 10/06).
#
# Prérequis : secrets de dépôt SUPABASE_ACCESS_TOKEN (Account → Access Tokens)
# et SUPABASE_DB_PASSWORD. Le project ref est public.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/migrations/**"
      - "supabase/config.toml" # verify_jwt par fonction y est défini
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: # déclenchement manuel possible

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: migrations puis edge functions
    # workflow_dispatch peut être lancé depuis n'importe quelle ref dans l'UI :
    # seule main est autorisée à utiliser le token de production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ifpqsyyvytfpossqycpc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Vérifier les secrets de déploiement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant. L'ajouter dans Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD manquant. L'ajouter avant tout déploiement de migration."
            exit 1
          fi

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.115.0

      - name: Lier le projet de production
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref "$PROJECT_REF"

      - name: Appliquer les migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      # Déploie toutes les fonctions selon supabase/config.toml (verify_jwt par
      # fonction y est défini). Les imports ../_shared/ sont suivis nativement
      # par la CLI (contrairement au bundler MCP).
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref "$PROJECT_REF"
