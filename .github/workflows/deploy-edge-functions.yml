name: Deploy edge functions

# Déploie les edge functions Supabase à chaque merge sur main qui les modifie.
# Élimine la dérive « repo ≠ prod » causée par les déploiements manuels depuis
# des sessions parallèles (cf. incidents du 10/06).
#
# Prérequis : ajouter le secret de dépôt SUPABASE_ACCESS_TOKEN
# (Supabase Dashboard → Account → Access Tokens). Le project ref est public.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch: # déclenchement manuel possible

permissions:
  contents: read

concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: supabase functions deploy
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ifpqsyyvytfpossqycpc
    steps:
      - uses: actions/checkout@v6

      - name: Vérifier la présence du token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN manquant. L'ajouter dans Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Déploie toutes les fonctions selon supabase/config.toml (verify_jwt par
      # fonction y est défini). Les imports ../_shared/ sont suivis nativement
      # par la CLI (contrairement au bundler MCP).
      - name: Deploy
        run: supabase functions deploy --project-ref "$PROJECT_REF"
