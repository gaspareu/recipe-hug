name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Analyse hebdomadaire (lundi 06:00 UTC) pour capter les nouvelles règles.
    - cron: "0 6 * * 1"

# Moindre privilège ; le job CodeQL élève ses propres permissions ci-dessous.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyse CodeQL (JS/TS)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Initialisation CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Requêtes étendues : sécurité + qualité.
          queries: security-and-quality

      - name: Analyse
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
