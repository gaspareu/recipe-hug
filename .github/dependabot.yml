version: 2
updates:
  # Dépendances npm de l'application
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Regroupe les bumps mineurs/patch pour limiter le bruit de PR
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Versions des GitHub Actions utilisées dans la CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
