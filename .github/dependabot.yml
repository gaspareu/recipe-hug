version: 2
updates:
  # Dépendances npm de l'application
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      # Sépare le risque runtime de l'outillage ; les majors restent isolées.
      runtime-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      dev-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # TypeScript 7 est incompatible avec typescript-eslint 8 (< 6.1.0).
    # Retirer cette exception dès que l'outillage ESLint prend TypeScript 7 en charge.
    ignore:
      - dependency-name: "typescript"
        versions: ["^7.0.0"]

  # Versions des GitHub Actions utilisées dans la CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:15"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch
